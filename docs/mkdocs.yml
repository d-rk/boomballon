site_name: Boom Balloon
site_description: An electronic balloon party game — firmware, hardware, and build guide.
site_url: https://d-rk.github.io/boomballon/
repo_url: https://github.com/d-rk/boomballon
repo_name: d-rk/boomballon
# Sources live in docs/src/; the built site goes to docs/site/ (a sibling).
docs_dir: src
site_dir: site
theme:
  name: material
  logo: assets/img/logo-icon.svg
  favicon: assets/img/favicon-128.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
extra_css:
  - assets/extra.css
plugins:
  # Listing plugins disables the built-in search, so name it explicitly.
  - search
  # Click-to-enlarge for the board galleries. Ships its own JS and CSS into
  # the built site, so nothing is fetched at runtime.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - The Story: story.md
  - How It Works: how-it-works.md
  - Gameplay:
      - Rules: gameplay/rules.md
      - The Card Deck: gameplay/card-deck.md
  - Build Guide:
      - System Overview: build-guide/overview-bom.md
      - Modules:
          - Overview: build-guide/modules/index.md
          - Card Reader: build-guide/modules/card-reader.md
          - Display: build-guide/modules/display.md
          - Control Board: build-guide/modules/control-board.md
      - Enclosure:
          - Overview: build-guide/enclosure/index.md
          - Upper Housing: build-guide/enclosure/upper-housing.md
          - Lower Housing: build-guide/enclosure/lower-housing.md
          - Roof: build-guide/enclosure/roof.md
          - Hose Nozzle: build-guide/enclosure/nozzle.md
          - Balloon Adapter: build-guide/enclosure/balloon-adapter.md
          - Card-Module Housing: build-guide/enclosure/card-module.md
      - Wiring & Pin Map: build-guide/wiring-pinmap.md
      - Firmware — Build & Flash: build-guide/firmware-build.md
  - Reference:
      - Bill of Materials: reference/bill-of-materials.md
      - Firmware Architecture: reference/firmware-architecture.md
      - Optical Code System: reference/optical-codes.md
      - Design Notes & Roadmap: reference/design-notes.md
