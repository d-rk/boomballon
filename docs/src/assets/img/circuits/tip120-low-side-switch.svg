<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="460" height="380" viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg">
<rect width="460" height="380" fill="#ffffff"/>
<g font-family="arial" fill="none" stroke="#000000" stroke-linecap="round">

  <!-- +12 V rail -->
  <line x1="100" y1="40" x2="340" y2="40" stroke-width="2"/>
  <text x="20" y="45" font-size="14" stroke="none" fill="#000000">+12 V</text>

  <!-- load branch -->
  <line x1="160" y1="40" x2="160" y2="90" stroke-width="2"/>
  <rect x="130" y="90" width="60" height="60" stroke-width="2"/>
  <text x="160" y="116" font-size="13" text-anchor="middle" stroke="none" fill="#000000">LOAD</text>
  <text x="160" y="133" font-size="10" text-anchor="middle" stroke="none" fill="#000000">pump / valve coil</text>
  <line x1="160" y1="150" x2="160" y2="210" stroke-width="2"/>

  <!-- flyback diode branch, cathode toward +12 V -->
  <line x1="280" y1="40" x2="280" y2="95" stroke-width="2"/>
  <line x1="260" y1="95" x2="300" y2="95" stroke-width="3"/>
  <polygon points="260,125 300,125 280,95" stroke-width="2"/>
  <line x1="280" y1="125" x2="280" y2="210" stroke-width="2"/>
  <text x="310" y="118" font-size="13" stroke="none" fill="#000000">1N4004</text>

  <!-- node joining load, diode and collector -->
  <line x1="160" y1="210" x2="280" y2="210" stroke-width="2"/>
  <circle cx="220" cy="210" r="3.5" fill="#000000" stroke="none"/>
  <line x1="220" y1="210" x2="220" y2="228" stroke-width="2"/>

  <!-- TIP120, simplified NPN symbol -->
  <circle cx="240" cy="262" r="42" stroke-width="1.5"/>
  <line x1="240" y1="238" x2="240" y2="286" stroke-width="3"/>
  <line x1="150" y1="262" x2="240" y2="262" stroke-width="2"/>
  <line x1="220" y1="228" x2="240" y2="246" stroke-width="2"/>
  <line x1="240" y1="278" x2="264" y2="298" stroke-width="2"/>
  <polygon points="252,282 264,286 257,296" fill="#000000" stroke="none"/>
  <line x1="264" y1="298" x2="264" y2="330" stroke-width="2"/>
  <text x="292" y="256" font-size="13" stroke="none" fill="#000000">TIP120</text>
  <text x="292" y="272" font-size="10" stroke="none" fill="#000000">Darlington</text>

  <!-- base resistor -->
  <polyline points="152,262 158,250 166,274 174,250 182,274 188,250 194,262" stroke-width="2"/>
  <text x="173" y="232" font-size="12" text-anchor="middle" stroke="none" fill="#000000">2.2 kΩ</text>

  <!-- MCU pin lead -->
  <line x1="90" y1="262" x2="152" y2="262" stroke-width="2"/>
  <circle cx="90" cy="262" r="4" stroke-width="2"/>
  <text x="20" y="248" font-size="12" stroke="none" fill="#000000">Arduino</text>
  <text x="20" y="263" font-size="12" stroke="none" fill="#000000">D6 / D7</text>

  <!-- ground symbol -->
  <line x1="264" y1="330" x2="264" y2="338" stroke-width="2"/>
  <line x1="248" y1="338" x2="280" y2="338" stroke-width="2.5"/>
  <line x1="254" y1="345" x2="274" y2="345" stroke-width="2"/>
  <line x1="260" y1="352" x2="268" y2="352" stroke-width="1.5"/>
  <text x="292" y="342" font-size="12" stroke="none" fill="#000000">GND</text>

</g>
</svg>
