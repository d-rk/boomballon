; PlatformIO project configuration for the Boom Balloon firmware.
; Board: Arduino Nano (ATmega328P). Sources live in src/.
;
; Build:   pio run                         (all environments)
; Upload:  pio run -t upload -e nanoatmega328      (Nano, old bootloader, 57600)
;          pio run -t upload -e micro              (Arduino Micro, early prototypes)
; Monitor: pio device monitor              (serial console at 9600 baud)
;
; Compile-time switches live in src/Constants.h (LOGGING_ENABLED, AUTOSTART_GAME,
; and ACTIVE_MODE — game vs. card-reader calibration). Toggle them there, or pass
; e.g. build_flags = -D LOGGING_ENABLED on the command line.

[env]
platform = atmelavr
framework = arduino
; The sources use root-relative angle-bracket includes (e.g. <Cards/Card.h>),
; so src/ must be on the include path.
build_flags = -I src
monitor_speed = 9600   ; matches Serial.begin(9600) in Log::setup()

[env:nanoatmega328]
; Primary target: Arduino Nano with the old bootloader (the project's boards are
; older clones). If an upload times out, the board may have the newer
; bootloader — use board = nanoatmega328new (115200 baud) instead.
board = nanoatmega328
upload_speed = 57600

[env:micro]
; Arduino Micro (ATmega32U4) — the board of the 2015-2018 prototypes. The pin
; map is unchanged since then, so a Micro still runs the current firmware.
board = micro
